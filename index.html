<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Speed Run - Lantai Berjalan</title>
    <style>
        body { text-align: center; font-family: 'Courier New', Courier, monospace; background: #333; color: white; margin: 0; overflow: hidden; }
        canvas { background: #f0f0f0; border-bottom: 5px solid #555; display: block; margin: 20px auto; width: 95%; max-width: 600px; }
        .info { font-size: 20px; margin-bottom: 10px; }
        .btn-jump { 
            padding: 20px 60px; font-size: 22px; font-weight: bold;
            background: #222; color: #fff; border: 2px solid #fff; border-radius: 10px; 
            cursor: pointer; user-select: none;
        }
        .btn-jump:active { background: #555; }
    </style>
</head>
<body>

    <div class="info">Skor: <span id="scoreVal">0</span> | Kecepatan: <span id="speedVal">1</span>x</div>
    <canvas id="gameCanvas" width="600" height="200"></canvas>
    <button class="btn-jump" id="jumpBtn">LOMPAT!</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreVal");
        const speedEl = document.getElementById("speedVal");

        let dinoY = 150;
        let gravity = 0;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 6; // Kecepatan awal
        let groundX = 0; // Untuk animasi jalan

        // Objek Rintangan
        let obstacle = { x: 700, width: 30, height: 40, type: 'ground' };

        function doJump() {
            if (dinoY >= 150 && !isGameOver) {
                gravity = -15;
            }
            if (isGameOver) location.reload();
        }

        // Kontrol
        document.getElementById("jumpBtn").addEventListener("touchstart", (e) => { e.preventDefault(); doJump(); });
        document.getElementById("jumpBtn").addEventListener("mousedown", doJump);
        window.addEventListener("keydown", (e) => { if (e.code === "Space") doJump(); });

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. ANIMASI JALAN (Garis-garis lantai)
            groundX -= gameSpeed;
            if (groundX < -100) groundX = 0;
            ctx.strokeStyle = "#bbb";
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(groundX + (i * 100), 195);
                ctx.lineTo(groundX + (i * 100) + 50, 195);
                ctx.stroke();
            }

            // 2. LOGIKA DINO
            gravity += 0.8;
            dinoY += gravity;
            if (dinoY > 150) { dinoY = 150; gravity = 0; }
            ctx.fillStyle = "#333"; // Warna Dino
            ctx.fillRect(50, dinoY, 40, 40);

            // 3. LOGIKA RINTANGAN (RANDOM & MAKIN CEPAT)
            obstacle.x -= gameSpeed;

            if (obstacle.x < -50) {
                score++;
                scoreEl.innerText = score;
                
                // Tambah kecepatan setiap skor naik
                gameSpeed += 0.3; 
                speedEl.innerText = (gameSpeed/6).toFixed(1);

                // Reset rintangan dengan variasi
                obstacle.x = 600 + Math.random() * 300;
                let r = Math.random();
                if (r > 0.7) {
                    // Rintangan Burung (Melayang sedikit)
                    obstacle.type = 'air';
                    obstacle.height = 20;
                    obstacle.width = 40;
                    obstacle.yPos = 120; 
                } else {
                    // Rintangan Balok Tanah
                    obstacle.type = 'ground';
                    obstacle.height = 30 + Math.random() * 30;
                    obstacle.width = 20 + Math.random() * 20;
                    obstacle.yPos = 200 - obstacle.height;
                }
            }

            // Gambar Rintangan
            ctx.fillStyle = obstacle.type === 'air' ? "#007bff" : "#ff4444";
            ctx.fillRect(obstacle.x, obstacle.yPos, obstacle.width, obstacle.height);

            // 4. CEK TABRAKAN
            let dinoRight = 50 + 40;
            let dinoBottom = dinoY + 40;
            if (50 < obstacle.x + obstacle.width && 
                dinoRight > obstacle.x && 
                dinoY < obstacle.yPos + obstacle.height &&
                dinoBottom > obstacle.yPos) {
                
                isGameOver = true;
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0,0,600,200);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER!", 210, 100);
                ctx.font = "20px Arial";
                ctx.fillText("Klik Tombol untuk Main Lagi", 170, 130);
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
