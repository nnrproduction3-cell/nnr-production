<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNR Production Official</title>
    <style>
        body {
            background: linear-gradient(-45deg, #004e92, #001f3f, #0052d4, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 40px 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container { width: 100%; max-width: 380px; text-align: center; }
        
        .logo-profile {
            width: 110px; height: 110px; background: #fff; border-radius: 50%;
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); overflow: hidden; border: 3px solid white;
        }
        .logo-profile img { width: 100%; height: 100%; object-fit: cover; }

        .badge {
            display: inline-block; background: #e63946; color: white;
            padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 20px;
        }

        .btn-link {
            background: white; color: #333; text-decoration: none;
            display: flex; align-items: center; padding: 8px; margin-bottom: 12px;
            border-radius: 12px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Kotak Ikon AR Hitam sesuai keinginanmu */
        .ar-box {
            width: 44px; height: 44px; background: #000; border-radius: 8px;
            margin-right: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .ar-logo-text { color: white; font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: -2px; }
        
        .btn-text { flex-grow: 1; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-profile">
            <img src="file_00000000aab871fa80c1aa477153d537.png" alt="Profile">
        </div>
        
        <h1 style="font-size: 22px; margin: 0;">@nnrprodution</h1>
        <div class="badge">🇮🇩 KARYA ANAK BANGSA INDONESIA</div>

        <div style="margin-top: 20px; text-align: left; font-weight: bold; font-size: 13px; margin-bottom: 10px;">TENTUKAN PILIHAN KAMU</div>

        <a href="https://youtube.com/@nnr13" class="btn-link">
            <div class="ar-box"><span class="ar-logo-text">AR</span></div>
            <div class="btn-text">KLIK, YOUTUBE NNR</div>
        </a>

        <a href="https://s.snackvideo.com/u/@nnrproduction" class="btn-link">
            <div class="ar-box"><span class="ar-logo-text">AR</span></div>
            <div class="btn-text">KLIK, SNACK VIDEO</div>
        </a>

        <div style="margin-top: 20px; text-align: left; font-weight: bold; font-size: 13px; margin-bottom: 10px;">INFO SOSIAL MEDIA</div>

        <a href="https://www.instagram.com/nnrprodution" class="btn-link">
            <div class="ar-box"><span class="ar-logo-text">AR</span></div>
            <div class="btn-text">INSTAGRAM UTAMA</div>
        </a>

        <a href="https://wa.me/628XXXXXXXXXX" class="btn-link">
            <div class="ar-box"><span class="ar-logo-text">AR</span></div>
            <div class="btn-text">HUBUNGI ADMIN</div>
        </a>
    </div>
</body>
</html>
