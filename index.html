<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNR Production Official</title>
    <style>
        body {
            background: linear-gradient(-45deg, #004e92, #001f3f, #0052d4, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .logo-profile {
            width: 110px; height: 110px; background: white; border-radius: 50%;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: center;
            border: 3px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .logo-profile img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge {
            background: #e63946; color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px; border-radius: 15px; width: 90%; max-width: 320px;
            text-align: center; margin-bottom: 25px; line-height: 1.6;
            backdrop-filter: blur(5px);
        }
        .links { width: 90%; max-width: 320px; }
        .btn {
            display: block; text-align: center; padding: 14px; margin-bottom: 12px;
            border-radius: 10px; font-weight: bold; text-decoration: none; color: white;
            text-transform: uppercase; font-size: 14px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-red { background-color: #ff0000; }
        .btn-yellow { background-color: #ffcc00; color: #000; }
        .btn-blue { background-color: #004e92; }
        .btn-dark { background-color: #222222; } /* Warna khusus itch.io */
    </style>
</head>
<body>
    <div class="logo-profile">
        <img src="nr.jpg" alt="NNR">
    </div>
    <h1 style="font-size: 22px; margin: 0;">@nnrprodution</h1>
    <div class="badge">🇮🇩 KARYA ANAK BANGSA INDONESIA</div>
    <div class="info-box">
        <h3 style="margin-top: 0;">Halo! Selamat datang di NNR.</h3>
        <p style="font-size: 13px;">Kami adalah tim pengembang game indie kreatif dari <b>HSS</b>. Mari berkolaborasi dan dukung kami terus ya!</p>
    </div>
    <div class="links">
        <a href="https://nnrproduction.itch.io/" class="btn btn-dark">Download Game Kami (Itch.io)</a>
        
        <a href="https://youtube.com/@nnr13" class="btn btn-red">Youtube Channel</a>
        <a href="https://s.snackvideo.com/u/@nnrproduction" class="btn btn-yellow">Snack Video</a>
        <a href=https://www.instagram.com/nnrproduction13811?igsh=MWNvY2QyNG41NTFlbA==" class="btn btn-blue">Instagram Official</a>
        <a href="https://www.instagram.com/nnrprodution" class="btn btn-blue">Instagram 2</a>
        <a href="https://wa.me/628XXXXXXXXXX" class="btn btn-blue">Hubungi Admin</a>
    </div>
</body>
</html>
